    <style>
      :root {
        --background: #ffffff;
        --foreground: #171513;
        --muted: #70675d;
        --rule: rgba(23, 21, 19, 0.09);
        --rule-strong: rgba(23, 21, 19, 0.18);
        --surface-soft: #f7f2e9;
        --accent: #7f5243;
        --page-x: clamp(18px, 5.2vw, 72px);
        --content-max: 1520px;
        --font-display: "plantin", Georgia, serif;
        --font-wordmark: var(--font-display);
        --serif: var(--font-display);
        --headline-serif: var(--font-display);
        --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
      }

      body {
        font-family: var(--sans);
        font-style: normal;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 2px solid rgba(141, 79, 61, 0.45);
        outline-offset: 3px;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        background: var(--background);
      }

      .shell {
        width: min(100%, var(--content-max));
        margin: 0 auto;
        padding-left: var(--page-x);
        padding-right: var(--page-x);
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: transparent;
        pointer-events: none;
      }

      .header-frame {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 1.5rem 2rem;
        padding-top: 28px;
        padding-bottom: 24px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-wordmark);
        font-size: clamp(2.4rem, 1.9rem + 1.43vw, 3.76rem);
        line-height: 0.92;
        letter-spacing: 0;
        font-weight: 400;
        font-optical-sizing: auto;
        white-space: nowrap;
        transform: translate3d(0, 0, 0);
        transition: transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;

      }

      .site-header .header-frame,
      .site-header .brand-mark,
      .site-header .header-tools {
        pointer-events: auto;
      }

      body.muzej-logo-hidden .site-header .brand-mark {
        transform: translate3d(0, calc(-100% - 42px), 0);
      }

      .about-page {
        min-height: calc(100svh - 120px);
        display: grid;
        align-items: center;
        padding-top: clamp(46px, 7vw, 112px);
        padding-bottom: clamp(72px, 9vw, 132px);
      }

      .about-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: min(100%, 70rem);
        margin: 0 auto;
        align-items: start;
        min-width: 0;
      }

      .about-copy {
        max-width: 70rem;
        margin: 0 auto;
        min-width: 0;
      }

      .about-copy h1 {
        width: 100%;
        max-width: 70rem;
        margin: 0;
        font-family: var(--headline-serif);
        font-size: clamp(1.25rem, 2vw, 1.85rem);
        line-height: 1.35;
        letter-spacing: 0;
        font-weight: 400;
        font-optical-sizing: auto;
        overflow-wrap: break-word;
      }

      .about-intro {
        max-width: 42rem;
        margin: clamp(2rem, 3.8vw, 4.2rem) 0 0;
        font-family: var(--serif);
        font-size: 2rem;
        line-height: 1.2;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--foreground);
        overflow-wrap: break-word;
      }

      .about-image-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(0.5rem, 1vw, 0.875rem);
        margin-top: clamp(3rem, 6vw, 5rem);
        width: 100%;
      }

      .about-image-strip img {
        display: block;
        width: 100%;
        height: clamp(180px, 24vw, 320px);
        object-fit: cover;
      }

      .about-social {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        justify-content: flex-start;
        width: min(100%, 70rem);
        margin: 0 auto;
        padding: 0 var(--page-x) clamp(34px, 5vw, 64px);
      }

      .about-social-link {
        font-family: var(--sans);
        font-size: clamp(1.05rem, 1.3vw, 1.25rem);
        line-height: 1.35;
        letter-spacing: 0;
        color: rgba(23, 21, 19, 0.58);
        transition: color 180ms ease;
      }

      .about-social-link:hover {
        color: var(--foreground);
      }

      @media (max-width: 980px) {
        .about-page {
          align-items: start;
        }

        .about-hero {
          grid-template-columns: 1fr;
          width: min(100%, 70rem);
        }

        .about-social {
          width: min(100%, 70rem);
        }

        .about-copy {
          max-width: none;
        }

        .about-image-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .about-image-strip img {
          height: 220px;
        }

        .about-copy h1 {
          max-width: 70rem;
        }
      }

      @media (max-width: 760px) {
        .header-frame {
          grid-template-columns: 1fr;
          justify-items: start;
          gap: 0.85rem 1.25rem;
          padding-top: 20px;
          padding-bottom: 18px;
        }

        .brand-mark {
          font-size: clamp(2.16rem, 10.15vw, 2.87rem);

        }

        .header-tools {
          justify-content: flex-start;
        }

        .about-page {
          min-height: auto;
          padding-top: 34px;
          padding-bottom: 72px;
        }

        .about-copy h1 {
          max-width: 100%;
        }
      }

      @media (max-width: 540px) {
        .about-copy {
          width: 19rem;
          max-width: 100%;
        }

        .about-copy h1 {
          max-width: 100%;
        }

        .about-image-strip {
          grid-template-columns: 1fr;
        }

        .about-social {
          width: 19rem;
          max-width: calc(100% - (var(--page-x) * 2));
          padding-right: 0;
          padding-left: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .brand-mark {
          transition: none;
          will-change: auto;

        }

        body.muzej-logo-hidden .site-header .brand-mark {
          transform: none;
        }
      }

@media (max-width: 768px) {
  .site-header { z-index: 2000; }
  .site-header .header-frame { grid-template-columns: minmax(0, 1fr) auto; align-items: center; justify-items: stretch; gap: 1rem; }
  .site-header .brand-mark { justify-self: start; min-width: 0; }
  .site-header .header-tools { justify-self: end; justify-content: flex-end; margin-left: auto; position: relative; z-index: 2002; }

  }
}

    <script>
      (function () {
        var previousY = Math.max(window.scrollY || window.pageYOffset || 0, 0);
        var ticking = false;
        var revealZone = 24;
        var motionThreshold = 4;
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        function updateMuzejLogoVisibility() {
          var currentY = Math.max(window.scrollY || window.pageYOffset || 0, 0);
          var delta = currentY - previousY;

          if (reducedMotion.matches) {
            document.body.classList.remove("muzej-logo-hidden");
            ticking = false;
            return;
          }

          if (currentY <= revealZone || delta < -motionThreshold) {
            document.body.classList.remove("muzej-logo-hidden");
          } else if (delta > motionThreshold) {
            document.body.classList.add("muzej-logo-hidden");
          }

          previousY = currentY;
          ticking = false;
        }

        function requestMuzejLogoVisibility() {
          if (!ticking) {
            window.requestAnimationFrame(updateMuzejLogoVisibility);
            ticking = true;
          }
        }

        window.addEventListener("scroll", requestMuzejLogoVisibility, { passive: true });
        window.addEventListener("resize", requestMuzejLogoVisibility);

        if (reducedMotion.addEventListener) {
          reducedMotion.addEventListener("change", requestMuzejLogoVisibility);
        } else if (reducedMotion.addListener) {
          reducedMotion.addListener(requestMuzejLogoVisibility);
        }

        updateMuzejLogoVisibility();
      })();
    </script>
    <script>


      document.querySelectorAll('.shop-gallery').forEach((gallery) => {
        const photos = Array.from(gallery.querySelectorAll('.shop-plate'));
        const controls = gallery.querySelector('.shop-gallery-controls');
        const status = gallery.querySelector('.shop-gallery-status');
        let current = 0;

        for (const button of controls.querySelectorAll('button')) {
          button.addEventListener('click', () => {
            photos[current].hidden = true;
            current = (current + Number(button.dataset.step) + photos.length) % photos.length;
            photos[current].hidden = false;
            status.textContent = photos[current].querySelector('img').alt;
          });
        }
        controls.hidden = false;
      });

      const zoom = document.querySelector('.shop-zoom');
      if (typeof zoom.showModal === 'function') {
        const enlarged = zoom.querySelector('img');
        document.querySelectorAll('.shop-enlarge').forEach((link) => {
          link.addEventListener('click', (event) => {
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            enlarged.alt = link.querySelector('img').alt;
            enlarged.src = link.href;
            zoom.showModal();
          });
        });

        zoom.addEventListener('click', (event) => {
          if (event.target === zoom) zoom.close();
        });
        zoom.addEventListener('close', () => {
          enlarged.removeAttribute('src');
          enlarged.alt = '';
        });
      }
    </script>
