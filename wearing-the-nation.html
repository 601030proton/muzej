#previous::after { transform: translateX(1px) rotate(135deg); }
.gallery-arrow:disabled { opacity: .35; cursor: default; }

    {"id": "2023-away", "year": "2023", "brand": "Jako", "variant": "Away", "source": "https://www.footballkitarchive.com/north-macedonia-2023-away-kit-130933/", "note": ""},
    {"id": "2023-third", "year": "2023", "brand": "Jako", "variant": "Third", "source": "https://www.footballkitarchive.com/north-macedonia-2023-third-kit-130934/", "note": ""},
    {"id": "2023-gk-1", "year": "2023", "brand": "Jako", "variant": "Goalkeeper 1", "source": "https://www.footballkitarchive.com/north-macedonia-2023-gk-1-kit-315787/", "note": ""},

    {"id": "2026-home", "year": "2026", "brand": "adidas", "variant": "Home", "source": "https://www.footballkitarchive.com/north-macedonia-2026-home-kit-467625/", "note": ""},
    {"id": "2026-gk-1", "year": "2026", "brand": "adidas", "variant": "Goalkeeper 1", "source": "https://www.footballkitarchive.com/north-macedonia-2026-gk-1-kit-467626/", "note": ""},
    {"id": "2026-27-home", "year": "2026–27", "brand": "adidas", "variant": "Home", "source": "https://www.footballkitarchive.com/north-macedonia-2026-27-home-kit-478822/", "note": ""},
    {"id": "2026-27-away", "year": "2026–27", "brand": "adidas", "variant": "Away", "source": "https://www.footballkitarchive.com/north-macedonia-2026-27-away-kit-478823/", "note": ""}
  ];
  const get = (id) => document.getElementById(id);
  const image = get('shirt');
  const rail = get('gallery-thumbs');
  const previous = get('previous');
  const next = get('next');
  const frame = get('frame');
  const archive = get('shirt-index');
  const imageDirectory = './Assets/Wearing%20the%20Nation/Jerseys/Archive/';
  const gallery = shirts.filter((shirt) => shirt.flatLay);
  const labelFor = (shirt) => [shirt.year, shirt.brand, shirt.variant].join(' · ');
  let index = 0;

  const thumbnails = new Map();
  const imageFor = (shirt) => shirt.image || imageDirectory + shirt.id + '.webp';

  function positionImage(element, shirt) {
    const [left, top, right, bottom, width, height] = shirt.flatLay;
    const scale = Math.min(0.76 * 4 / 3 / (bottom - top), 0.92 / (right - left));
    element.style.setProperty('--image-width', (width * scale * 100) + '%');
    element.style.setProperty('--image-left', (0.5 - (left + right) / 2 * scale) * 100 + '%');
    element.style.setProperty('--image-top', (0.5 - (top + bottom) / 2 * scale * 3 / 4) * 100 + '%');
    const insets = [top / height, (width - right) / width, (height - bottom) / height, left / width];
    element.style.setProperty('--image-crop', 'inset(' + insets.map((inset) => inset * 100 + '%').join(' ') + ')');
  }

  for (const shirt of gallery) {
    const button = document.createElement('button');
    button.className = 'gallery-thumb';
    button.type = 'button';
    button.setAttribute('aria-label', labelFor(shirt));
    const preview = document.createElement('span');
    preview.className = 'gallery-thumb-image';
    const thumb = document.createElement('img');
    thumb.alt = '';
    thumb.className = 'shirt-image';
    thumb.decoding = 'async';
    thumb.src = imageFor(shirt);
    positionImage(thumb, shirt);
    preview.append(thumb);
    const caption = document.createElement('span');
    caption.className = 'gallery-thumb-label';
    caption.textContent = shirt.year;
    button.append(preview, caption);
    button.addEventListener('click', () => show(gallery.indexOf(shirt)));
    rail.append(button);
    thumbnails.set(shirt.id, button);
  }

  function show(position, updateLink = true) {
    index = Math.max(0, Math.min(position, gallery.length - 1));
    const shirt = gallery[index];
    if (!shirt) return;
    archive.hidden = true;
    positionImage(image, shirt);
    const label = labelFor(shirt);
    image.alt = label;
    const src = imageFor(shirt);
    if (image.getAttribute('src') !== src) {
      image.hidden = true;
      image.src = src;
    }
    if (image.complete && image.naturalWidth) image.hidden = false;

    get('title').textContent = shirt.year;
    get('maker').textContent = shirt.brand + ' · ' + shirt.variant;
    get('note').textContent = shirt.note;
    get('note').hidden = !shirt.note;
    for (const [id, thumbnail] of thumbnails) {
      if (id === shirt.id) thumbnail.setAttribute('aria-current', 'true');
      else thumbnail.removeAttribute('aria-current');
    }
    const active = thumbnails.get(shirt.id);
    const thumbnailBounds = active.getBoundingClientRect();
    const railBounds = rail.getBoundingClientRect();
    if (thumbnailBounds.left < railBounds.left) rail.scrollLeft += thumbnailBounds.left - railBounds.left;
    if (thumbnailBounds.right > railBounds.right) rail.scrollLeft += thumbnailBounds.right - railBounds.right;
    previous.disabled = index === 0;
    next.disabled = index === gallery.length - 1;
    if (updateLink && location.hash !== '#' + shirt.id) history.replaceState(null, '', '#' + shirt.id);
  }

  function applyLocation() {
    const legacy = /^shirt-(1994|1998|2016|2021|2023)$/.exec(location.hash.slice(1));
    const id = legacy ? legacy[1] + '-home' : location.hash.slice(1);
    const position = gallery.findIndex((shirt) => shirt.id === id);
    if (position !== -1) {
      show(position, Boolean(legacy));
      return;
    }

    if (id === archive.id || shirts.some((shirt) => shirt.id === id)) {
      archive.hidden = false;
      const record = get(id);
      if (record) requestAnimationFrame(() => record.scrollIntoView({ block: 'start' }));
    }
  }

  for (const shirt of shirts) {
    const row = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = labelFor(shirt);
    if (shirt.note) {
      const note = document.createElement('small');
      note.textContent = shirt.note;
      label.append(note);
    }

    row.append(label);
    row.id = shirt.flatLay ? 'record-' + shirt.id : shirt.id;
    get('shirt-records').append(row);
  }
  const slideshow = document.querySelector('.shirt-slideshow');

  image.addEventListener('load', () => {
    image.hidden = false;
  });
  image.addEventListener('error', () => {
    if (!image.complete || image.naturalWidth || !gallery.length) return;
    const failed = gallery[index];
    get('record-' + failed.id).id = failed.id;
    thumbnails.get(failed.id).remove();
    thumbnails.delete(failed.id);
    gallery.splice(index, 1);
    if (gallery.length) {
      show(index);
    } else {
      slideshow.hidden = true;
      archive.hidden = false;
    }
  });
  window.addEventListener('hashchange', applyLocation);
  previous.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  slideshow.addEventListener('keydown', (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      show(index + (event.key === 'ArrowLeft' ? -1 : 1));
    }
  });
  let startX;
  frame.addEventListener('touchstart', (event) => { startX = event.changedTouches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', (event) => {
    const distance = event.changedTouches[0].clientX - startX;
    startX = undefined;
    if (Math.abs(distance) >= 45) show(index + (distance > 0 ? -1 : 1));
  });
  rail.closest('nav').hidden = false;
  show(0, false);
  applyLocation();
})();
</script>
</body>
</html>
