    {"id": "2026-27-away", "year": "2026–27", "brand": "adidas", "variant": "Away", "source": "https://www.footballkitarchive.com/north-macedonia-2026-27-away-kit-478823/", "image": "https://www.footballkitarchive.com/cdn/2026/11/05/tiKNjerpaKBaNQt/north-macedonia-2026-27-away-kit.jpg", "note": ""}
  ];
  const get = (id) => document.getElementById(id);
  const image = get('shirt');
  const year = get('jump');
  const previous = get('previous');
  const next = get('next');
  const frame = get('frame');
  const legacyLink = /^#shirt-(1994|1998|2016|2021|2023)$/.exec(location.hash);
  const initialShirt = legacyLink ? '#' + legacyLink[1] + '-home' : location.hash;
  let index = Math.max(0, shirts.findIndex((shirt) => '#' + shirt.id === initialShirt));

  year.options.length = 0;
  year.disabled = false;

  for (const date of new Set(shirts.map((shirt) => shirt.year))) {
    year.add(new Option(date, date));
  }

  function show(position) {
    index = Math.max(0, Math.min(position, shirts.length - 1));
    const shirt = shirts[index];
    const label = [shirt.year, shirt.brand, shirt.variant].join(' · ');
    image.hidden = false;
    get('unavailable').hidden = true;
    image.alt = label;
    if (image.getAttribute('src') !== shirt.image) image.src = shirt.image;
    get('title').textContent = label;
    get('note').textContent = shirt.note;
    get('note').hidden = !shirt.note;
    get('source').href = shirt.source;
    get('position').textContent = (index + 1) + ' / ' + shirts.length;
    previous.disabled = index === 0;
    next.disabled = index === shirts.length - 1;
    year.value = shirt.year;
    if (location.hash !== '#' + shirt.id) history.replaceState(null, '', '#' + shirt.id);
  }

  image.addEventListener('error', () => {
    image.hidden = true;
    get('unavailable').hidden = false;
  });
  previous.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  year.addEventListener('change', () => show(shirts.findIndex((shirt) => shirt.year === year.value)));
  document.querySelector('.shirt-slideshow').addEventListener('keydown', (event) => {
    if (event.target === year || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      show(index + (event.key === 'ArrowLeft' ? -1 : 1));
    }
  });
  let startX;
  frame.addEventListener('touchstart', (event) => { startX = event.changedTouches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', (event) => {
    const distance = event.changedTouches[0].clientX - startX;
    startX = undefined;
    if (Math.abs(distance) >= 45) show(index + (distance > 0 ? -1 : 1));
  });
  show(index);
})();
</script>
</body>
</html>
