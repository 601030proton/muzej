  const get = (id) => document.getElementById(id);
  const image = get('shirt');
  const year = get('jump');
  const previous = get('previous');
  const next = get('next');
  const frame = get('frame');
  const archive = get('shirt-index');
  const indexLink = get('view-index');
  const imageDirectory = './Assets/Wearing%20the%20Nation/Jerseys/Archive/';
  const gallery = shirts.filter((shirt) => shirt.flatLay);
  const labelFor = (shirt) => [shirt.year, shirt.brand, shirt.variant].join(' · ');
  let index = 0;

  function setYears() {
    year.options.length = 0;
    for (const date of new Set(gallery.map((shirt) => shirt.year))) {
      year.add(new Option(date, date));
    }
    year.disabled = gallery.length === 0;
  }

  function show(position, updateLink = true) {
    index = Math.max(0, Math.min(position, gallery.length - 1));
    const shirt = gallery[index];
    if (!shirt) return;

    const [left, top, right, bottom, width, height] = shirt.flatLay;
    const scale = Math.min(0.70 * 4 / 3 / (bottom - top), 0.90 / (right - left));
    image.style.setProperty('--image-width', (width * scale * 100) + '%');
    image.style.setProperty('--image-left', (0.5 - (left + right) / 2 * scale) * 100 + '%');
    image.style.setProperty('--image-top', (0.5 - (top + bottom) / 2 * scale * 3 / 4) * 100 + '%');
    const insets = [top / height, (width - right) / width, (height - bottom) / height, left / width];
    image.style.setProperty('--image-crop', 'inset(' + insets.map((inset) => inset * 100 + '%').join(' ') + ')');
    const label = labelFor(shirt);
    image.alt = label;
    const src = shirt.image || imageDirectory + shirt.id + '.webp';
    if (image.getAttribute('src') !== src) {
      image.hidden = true;
      image.src = src;
    }
    if (image.complete && image.naturalWidth) image.hidden = false;

    get('title').textContent = label;
    get('note').textContent = shirt.note;
    get('note').hidden = !shirt.note;
    get('source').href = shirt.imageSource || shirt.source;
    get('source').textContent = shirt.imageSource ? 'Classic Football Shirts' : 'Football Kit Archive';
    get('position').textContent = (index + 1) + ' / ' + gallery.length;
    previous.disabled = index === 0;
    next.disabled = index === gallery.length - 1;
    year.value = shirt.year;
    if (updateLink && location.hash !== '#' + shirt.id) history.replaceState(null, '', '#' + shirt.id);
  }

  function applyLocation() {
    const legacy = /^shirt-(1994|1998|2016|2021|2023)$/.exec(location.hash.slice(1));
    const id = legacy ? legacy[1] + '-home' : location.hash.slice(1);
    const position = gallery.findIndex((shirt) => shirt.id === id);
    if (position !== -1) {
      show(position, Boolean(legacy));
      return;
    }

    if (id === archive.id || shirts.some((shirt) => shirt.id === id)) {
      archive.open = true;
      const record = get(id);
      if (record) requestAnimationFrame(() => record.scrollIntoView({ block: 'start' }));
    }
  }

  for (const shirt of shirts) {
    const row = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = labelFor(shirt);
    if (shirt.note) {
      const note = document.createElement('small');
      note.textContent = shirt.note;
      label.append(note);
    }

    const source = document.createElement('a');
    source.href = shirt.source;
    source.textContent = 'Archive record';
    source.setAttribute('aria-label', 'Archive record for ' + labelFor(shirt));
    row.append(label, source);
    row.id = shirt.flatLay ? 'record-' + shirt.id : shirt.id;
    get('shirt-records').append(row);
  }
  archive.hidden = false;
  indexLink.hidden = false;
  indexLink.addEventListener('click', () => { archive.open = true; });
  const slideshow = document.querySelector('.shirt-slideshow');

  image.addEventListener('load', () => {
    image.hidden = false;
  });
  image.addEventListener('error', () => {
    if (!image.complete || image.naturalWidth || !gallery.length) return;
    get('record-' + gallery[index].id).id = gallery[index].id;
    gallery.splice(index, 1);
    setYears();
    if (gallery.length) {
      show(index);
    } else {
      slideshow.hidden = true;
      archive.open = true;
    }
  });
  window.addEventListener('hashchange', applyLocation);
  previous.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  year.addEventListener('change', () => show(gallery.findIndex((shirt) => shirt.year === year.value)));
  slideshow.addEventListener('keydown', (event) => {
    if (event.target === year || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      show(index + (event.key === 'ArrowLeft' ? -1 : 1));
    }
  });
  let startX;
  frame.addEventListener('touchstart', (event) => { startX = event.changedTouches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', (event) => {
    const distance = event.changedTouches[0].clientX - startX;
    startX = undefined;
    if (Math.abs(distance) >= 45) show(index + (distance > 0 ? -1 : 1));
  });
  setYears();
  show(0, false);
  applyLocation();
})();
</script>
</body>
</html>
